name: closing-form
on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  repository_dispatch:
    types: [closing-listo]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Procesar formulario post-closing
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: python3 autofill/nl_closing_form.py
